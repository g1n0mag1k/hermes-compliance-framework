services:
  - type: web
    name: hermes-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: HERMES_API_KEY
        generateValue: true
      - key: HERMES_VAULT_KEY
        generateValue: true
      - key: HERMES_VAULT_DB_PATH
        value: /tmp/hermes_vault.db
      - key: HERMES_ENV
        value: production
      - key: HERMES_SIGNING_KEY
        sync: false
    healthCheckPath: /health
