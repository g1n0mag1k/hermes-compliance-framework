[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-relay"
version = "1.0.0"
description = "Local-first PHI detection and compliance evidence for MSPs serving HIPAA-covered entities"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "Andrew Rogers", email = "andrew@hermesrelay.dev"}
]
keywords = ["HIPAA", "PHI", "compliance", "MSP", "healthcare", "DLP"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "spacy==3.8.16",
    "presidio-analyzer==2.2.364",
    "cryptography==50.0.2",
    "pydantic==2.14.0",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "reportlab==5.0.1",
    # V2 receipt architecture
    "jcs==0.2.1",
    "pycose==1.1.0",
    "cbor2==6.1.5",
]

[project.scripts]
hermes-relay = "hermes.cli:main"
hermes-verify = "hermes.receipts.v2.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes*", "gateway*"]

