[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-relay"
version = "1.0.0"
description = "Local-first PHI detection and compliance evidence for HIPAA-covered entities, business associates and MSPs"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "Andrew Rogers", email = "andrew@hermesrelay.dev"}
]
keywords = ["HIPAA", "PHI", "compliance", "healthcare", "business-associate", "MSP", "DLP", "multi-tenant"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "spacy==3.8.16",
    # preshed 3.0.14 breaks spaCy 3.8.16 model loading (OverflowError in
    # Tokenizer._flush_specials). Pin until spaCy ships a compatible release.
    "preshed==3.0.13",
    "presidio-analyzer==2.2.364",
    "cryptography==50.0.2",
    "pydantic==2.14.1",
    "fastapi==0.161.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "reportlab==5.1.0",
    "pandas==3.1.0",
    # V2 receipt architecture
    "jcs==0.2.1",
    "pycose==1.1.0",
    "cbor2==6.1.5",
]

[project.scripts]
hermes-relay = "hermes.cli:main"
hermes-verify = "hermes.receipts.v2.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes*", "gateway*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Rules intentionally not enforced in this codebase:
#   BLE001 — broad `except Exception` catches are used deliberately in
#             health-check endpoints, CLI dispatch, and receipt export paths
#             where we log and degrade gracefully rather than crash.
#   B008   — FastAPI's Depends() in default arguments is the idiomatic
#             pattern for dependency injection; flagging it produces 14+
#             false positives with no actionable fix.
#   S110   — try/except/pass is used in optional-feature probe paths.
#   RUF059 — unpacked-but-unused loop vars (e.g. `for _, ws in ...`)
#             are intentional iteration discards, not bugs.
#   SIM118 — `key in d.keys()` is used for readability in a few spots.
#   PLR0133— constant-comparison in test fixtures is intentional.
#   DTZ011 — date.today() without tz is fine for audit timestamps.
ignore = [
    "BLE001",
    "B008",
    "S110",
    "RUF059",
    "SIM118",
    "PLR0133",
    "DTZ011",
]

[tool.mypy]
# Baseline mypy config — codebase predates strict type annotations.
# Pre-existing type issues are suppressed inline with # type: ignore[code]
# comments to maintain a zero-error baseline without masking new errors.
python_version = "3.12"
ignore_missing_imports = true

[tool.bandit]
skips = ["B101", "B601"]

