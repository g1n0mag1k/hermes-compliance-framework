name: Hermes CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: g1n0mag1k/hermes-compliance

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Lint, type-check, and SAST (fast; runs before tests)
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint / Type-check / SAST
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check hermes/ gateway/ tests/

      - name: Mypy type-check
        run: mypy hermes/ gateway/ --ignore-missing-imports

      - name: Bandit SAST
        run: bandit -r hermes/ gateway/ -c pyproject.toml --exit-zero

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Tests must pass before anything else runs
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    needs: [ lint ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run pytest with coverage
        run: |
          pytest -v --tb=short \
            --cov=hermes --cov=gateway \
            --cov-report=term-missing \
            --cov-fail-under=80

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Dependency audit (runs in parallel with tests)
  # ─────────────────────────────────────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install direct dependencies
        run: pip install -r requirements.txt

      - name: Run pip-audit on direct dependencies
        # Flags only CVEs in direct pins — transitive starlette findings
        # are acknowledged in PHASE2_AUDIT_TRAIL.md and do not block CI.
        # Remove --ignore-vuln flags once starlette is patched upstream.
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln GHSA-f96h-pmfr-66vw \
            --ignore-vuln GHSA-jjg7-2v4v-x38h \
            --ignore-vuln GHSA-qj8w-rv5x-2v9h \
            --ignore-vuln GHSA-74m5-2c7w-9w3x \
            --ignore-vuln GHSA-6vqw-3v5j-54x4 \
            --ignore-vuln GHSA-35jj-vqcf-f2jf \
            --ignore-vuln GHSA-cp75-3r2x-4qmc \
            --ignore-vuln GHSA-h8gr-9994-4x4g \
            --ignore-vuln PYSEC-2026-1325

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Build & push to GHCR (only on green test + audit, only on main)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-24.04
    needs: [ test, audit ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=1.0.0
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
