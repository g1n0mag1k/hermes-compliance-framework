name: Dependency Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Install direct dependencies
        run: pip install -r requirements.txt

      - name: Audit direct dependencies
        # Flags only CVEs in direct pins — transitive starlette/ecdsa findings
        # are acknowledged in SECURITY.md and PHASE2_AUDIT_TRAIL.md.
        # Remove --ignore-vuln flags once patched upstream.
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln GHSA-f96h-pmfr-66vw \
            --ignore-vuln GHSA-jjg7-2v4v-x38h \
            --ignore-vuln GHSA-qj8w-rv5x-2v9h \
            --ignore-vuln GHSA-74m5-2c7w-9w3x \
            --ignore-vuln GHSA-6vqw-3v5j-54x4 \
            --ignore-vuln GHSA-35jj-vqcf-f2jf \
            --ignore-vuln GHSA-cp75-3r2x-4qmc \
            --ignore-vuln GHSA-h8gr-9994-4x4g \
            --ignore-vuln PYSEC-2026-1325
